ServerRoot "/etc/httpd"
PidFile /lab/state/httpd.pid
Listen 127.0.0.1:8080
ServerName localhost
LoadModule authz_host_module modules/mod_authz_host.so
LoadModule dir_module modules/mod_dir.so
LoadModule mime_module modules/mod_mime.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule php5_module modules/libphp5.so
PHPIniDir /lab/phpini
User apache
Group apache
ServerLimit 1
StartServers 1
MinSpareServers 1
MaxSpareServers 2
MaxClients 1
MaxRequestsPerChild 0
KeepAlive Off
ErrorLog /lab/state/error.log
LogLevel warn
TypesConfig /etc/mime.types
DocumentRoot /lab/www
<Directory /lab/www>
    Order allow,deny
    Allow from all
    AllowOverride None
</Directory>
<FilesMatch "\.php$">
    SetHandler application/x-httpd-php
</FilesMatch>
<Directory /lab/www/parts>
    php_value max_multipart_body_parts 8
</Directory>
<Directory /lab/www/warn>
    php_value date.timezone Fixture_Invalid_Timezone
</Directory>
<Directory /lab/www/probe>
    php_value ko_lab.early_check 1
</Directory>
php_admin_value memory_limit 24M
php_admin_value post_max_size 2000M
php_admin_value upload_max_filesize 2000M
php_value max_execution_time 12000
php_admin_value max_input_time 12000
php_admin_value max_input_vars 1000
php_admin_value max_file_uploads 20
php_admin_value session.save_path /lab/state/sessions
php_admin_value upload_tmp_dir /lab/state/uploads
php_admin_value date.timezone UTC
php_admin_flag display_errors Off
php_admin_flag log_errors On
php_admin_flag session.upload_progress.enabled On
php_admin_flag session.upload_progress.cleanup Off
