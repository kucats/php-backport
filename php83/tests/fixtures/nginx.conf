user apache;
worker_processes 1;
pid /lab/state/nginx.pid;
error_log /lab/state/nginx-error.log warn;
events { worker_connections 64; }
http {
  access_log off;
  client_max_body_size 2000m;
  client_body_temp_path /lab/state/client-body;
  fastcgi_temp_path /lab/state/fastcgi;
  server {
    listen 127.0.0.1:8080;
    root /lab/www;
    location ~ \.php$ {
      include /etc/nginx/fastcgi_params;
      fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
      fastcgi_param PHP_VALUE $fixture_ini;
      fastcgi_pass 127.0.0.1:9000;
      fastcgi_request_buffering off;
      fastcgi_read_timeout 12000;
    }
  }
  map $uri $fixture_ini {
    default "max_multipart_body_parts=-1";
    ~^/parts/ "max_multipart_body_parts=8";
  }
}
